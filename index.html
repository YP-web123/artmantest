<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',-apple-system,sans-serif;background:#f5f0eb;color:#2c2c2c;min-height:100vh}
.hero{background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);color:#f5f0eb;padding:44px 20px 34px;text-align:center;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 70%,rgba(255,215,0,.05),transparent 60%);pointer-events:none}
.hero h1{font-family:'Noto Serif SC',serif;font-size:2rem;font-weight:700;letter-spacing:5px;margin-bottom:4px;position:relative;z-index:1}
.hero .sub{font-size:.85rem;opacity:.7;letter-spacing:3px;position:relative;z-index:1}
.hero .badge{display:inline-block;margin-top:12px;padding:2px 16px;border:1px solid rgba(245,240,235,.22);border-radius:20px;font-size:.68rem;letter-spacing:2px;color:rgba(245,240,235,.5);position:relative;z-index:1}
.container{max-width:720px;margin:0 auto;padding:20px 16px 50px}
.section-title{font-family:'Noto Serif SC',serif;font-size:1.15rem;font-weight:600;margin:18px 0 10px;padding-bottom:6px;border-bottom:2px solid #ddd;display:flex;align-items:center;gap:8px}
.section-title .tag{font-size:.62rem;font-weight:400;color:#999;letter-spacing:1px}
.stats-flash{text-align:center;font-size:.72rem;color:#999;margin-bottom:12px;padding:6px 12px;background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.04);display:inline-block;width:100%}
.q-card{background:#fff;border-radius:10px;padding:14px 17px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.q-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.06)}
.q-header{display:flex;align-items:flex-start;gap:7px;margin-bottom:7px}
.q-num{font-size:.67rem;color:#8b5e3c;background:#f5ede1;border-radius:5px;padding:1px 8px;white-space:nowrap;flex-shrink:0;margin-top:2px}
.q-text{font-size:.88rem;line-height:1.75;font-weight:500}
.q-type{display:inline-block;font-size:.56rem;color:#fff;border-radius:3px;padding:0 6px;margin-left:6px;letter-spacing:1px}
.t-obj{background:#6c5b7b}.t-sub{background:#c06c4a}.t-fill{background:#3a7ca5}
.options{display:flex;flex-direction:column;gap:3px}
.option{display:flex;align-items:flex-start;gap:9px;padding:6px 10px;border-radius:7px;cursor:pointer;transition:background .12s;font-size:.84rem;line-height:1.6;border:1px solid transparent}
.option:hover{background:#f9f5f0}
.option input{margin-top:4px;flex-shrink:0;accent-color:#8b5e3c}
.option.selected{background:#f5ede1;border-color:#d4b896}
.blank-input{width:100%;padding:8px 11px;border:1px solid #ddd;border-radius:7px;font-size:.85rem;font-family:inherit;outline:none;transition:border-color .2s;background:#fafafa;margin-top:2px}
.blank-input:focus{border-color:#8b5e3c;background:#fff}
.submit-wrap{text-align:center;margin:28px 0 16px}
.btn-submit{padding:15px 60px;font-size:1rem;font-family:inherit;font-weight:600;background:linear-gradient(135deg,#c9a96e,#b8860b);color:#fff;border:none;border-radius:36px;cursor:pointer;letter-spacing:3px;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 20px rgba(184,134,11,.35);position:relative}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(184,134,11,.5)}
.btn-submit::after{content:'';position:absolute;inset:-3px;border-radius:40px;border:2px solid rgba(184,134,11,.3);animation:pulse 2s infinite;pointer-events:none}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.8;transform:scale(1.04)}}
.result-wrap{display:none;margin-top:20px}
.result-wrap.show{display:block}
.result-card{background:#fff;border-radius:14px;padding:26px 24px;box-shadow:0 4px 18px rgba(0,0,0,.06);text-align:center}
.result-card .emoji-big{font-size:3.2rem;margin-bottom:4px}
.result-card .title{font-family:'Noto Serif SC',serif;font-size:1.5rem;font-weight:700;margin-bottom:2px}
.result-card .score{font-size:.9rem;color:#888;margin-bottom:14px}
.result-card .comment{font-size:.83rem;line-height:1.9;color:#444;text-align:left;background:#f9f5f0;padding:16px 18px;border-radius:10px;border-left:3px solid #b8860b;margin-top:8px}
.roast-row{margin:8px 0 0;padding:8px 0 8px 10px;border-left:2px solid #e8d5c0;font-size:.8rem;color:#555;line-height:1.75}
.roast-row .rn{font-weight:600;color:#c0392b}
.btn-review{padding:10px 32px;font-size:.82rem;font-family:inherit;background:transparent;color:#b8860b;border:1px solid #b8860b;border-radius:28px;cursor:pointer;letter-spacing:1px;transition:.2s;margin:14px auto 0;display:inline-block}
.btn-review:hover{background:#f5ede1}
.review-panel{display:none;text-align:left;margin-top:14px}
.review-panel.show{display:block}
.rv-item{background:#fafafa;border-radius:8px;padding:11px 13px;margin-bottom:8px;font-size:.8rem;line-height:1.7}
.rv-item .rv-num{font-weight:600;color:#b8860b;margin-right:4px}
.rv-item .rv-correct{color:#27ae60;font-weight:500}
.rv-item .rv-expl{color:#666;margin-top:2px;font-size:.75rem}
.rv-item .stat-row{display:flex;align-items:center;gap:8px;margin:2px 0;font-size:.74rem}
.rv-item .stat-bar-wrap{flex:1;height:6px;background:#eee;border-radius:3px;overflow:hidden}
.rv-item .stat-bar-fill{height:100%;border-radius:3px;transition:width .4s}
.rv-item .stat-label{min-width:22px;text-align:right;color:#888;font-size:.72rem}
.rv-item .stat-opt{min-width:24px;color:#555;font-weight:500}
.rv-item .fill-stat{margin-top:4px;font-size:.8rem}
.rv-item .fill-stat .big-num{font-size:1.1rem;font-weight:700;color:#27ae60}
@media(max-width:500px){.hero h1{font-size:1.4rem;letter-spacing:3px}.q-card{padding:12px}.result-card{padding:16px 12px}.btn-submit{padding:14px 40px}}
</style>
</head>
<body>

<div class="hero">
  <h1>文艺青年鉴赏考试</h1>
  <p class="sub">测测你到底读了多少书，还是只读了几篇公众号</p>
  <span class="badge">📝 客观题 + 主观题 + 填空题 · 共 30 题</span>
</div>

<div class="container" id="root"></div>

<script>
// ============================================================
// JSONBin 配置 —— 填入你自己的 Bin ID 和 API Key 即可开启云端共享统计
// 留空则仅使用本机 localStorage 模式

const CLOUD_ENABLED = true;        // 改为 true 启用
const BIN_ID = '6a740283f5f4af5e29f10f1d';       // 你的 JSONBin Bin ID
const API_KEY = '$2a$10$QUGwQUzpEqIiFViAJt5viOHfUxtHCoP8.3fuLK1x2c.qqlh3swfuS';     // 你的 JSONBin API Key

// ============================================================
// 题目数据
// ============================================================
const Q = [
  // ============ 客观题 1-20 ============
  {
    id:1, type:'obj',
    q:'后现代理论视域中，以下哪一项至今仍活着？（未被宣告死亡）',
    o:[
      {t:'上帝',s:0,note:'上帝不仅已死，还是被一个疯子宣判的'},
      {t:'作者',s:0,note:'作品诞生之后，作者就"死"了'},
      {t:'哲学',s:0,note:'被很多人宣判过，甚至科学家霍金也宣判了'},
      {t:'文学',s:3,note:'至今没有人敢审判文学'}
    ],
    roast:'后现代理论有个奇怪的爱好——到处发讣告。上帝被疯子杀了，作者被巴特杀了，哲学被霍金补了一刀。唯独文学，被翻来覆去讨论过无数次危机，但始终没人敢判它死刑——因为文学没有单一的身体可以被处决。每次你以为它死了，它换个姿势又坐起来了。',
    fullExplain:'<div style="margin-bottom:6px"><span style="color:#27ae60;font-weight:600">✓ D. 文学（3分）</span>——至今没有人敢审判文学</div><div style="padding-left:12px;color:#444;margin-bottom:8px">后现代理论有个奇怪的爱好：宣判各种东西的"死亡"。上帝被尼采借疯子之口杀了，作者被罗兰·巴特杀了，哲学被霍金补了一刀——唯独文学，被翻来覆去讨论过无数次"危机"，却始终没人敢给它发讣告。说到底，文学这种东西没有单一的身体可以处决——你每次判它死刑，它换个姿势又活过来了。</div><hr style="border:none;border-top:1px solid #e8e0d0;margin:8px 0"><div style="color:#999;font-size:.75rem">✗ A. 上帝——不仅已死，还是疯子宣判的。尼采没说"不存在"，他说"被我们杀了"。</div><div style="color:#999;font-size:.75rem">✗ B. 作者——作品诞生那一刻，作者就"死"了，这是巴特1967年的判决。</div><div style="color:#999;font-size:.75rem">✗ C. 哲学——霍金宣判后哲学家们依然在出书，这次宣判显然没有生效。</div>'
  },
  {
    id:2, type:'obj',
    q:'以下哪部电影作品表达了反战主题？',
    o:[
      {t:'神秘博士',s:0,note:'科幻电视剧，没有反战主题'},
      {t:'奇爱博士',s:3,note:'就是那个坐着导弹飞向太空的博士'},
      {t:'奇异博士',s:0,note:'这个虽然反地球毁灭，但是也不算反战'},
      {t:'卡里加里博士',s:0,note:'属于客串的选项'}
    ],
    roast:'这题确实容易串——题目里挤了四个博士，三个都跟反战没关系。神秘博士忙着穿越时空，奇异博士忙着打多玛姆，卡里加里博士在1920年的默片里搞催眠。只有奇爱博士不干正事——骑着核弹飞向太空，顺便把冷战整个讽刺了一遍。在一堆博士里找错人是常有的事，毕竟博士太多了。',
    fullExplain:'<div style="margin-bottom:6px"><span style="color:#27ae60;font-weight:600">✓ B. 奇爱博士（3分）</span>——就是那个骑着核弹飞向太空的博士</div><div style="padding-left:12px;color:#444;margin-bottom:8px">库布里克1964年的黑色喜剧。一个发疯的美国将军擅自发动核打击，而坐轮椅的前纳粹科学家奇爱博士最后骑着核弹飞向了太空——这不是科幻，这是讽刺。片名副标题叫"我如何学会停止担忧并爱上炸弹"——"爱上炸弹"四个字，就是对冷战核逻辑最优雅的竖中指。</div><hr style="border:none;border-top:1px solid #e8e0d0;margin:8px 0"><div style="color:#999;font-size:.75rem">✗ A. 神秘博士——英国科幻长寿剧，主要讲时空冒险，不关战争的事。</div><div style="color:#999;font-size:.75rem">✗ C. 奇异博士——漫威的，反的是多玛姆的维度吞噬，反战不是他的业务范围。</div><div style="color:#999;font-size:.75rem">✗ D. 卡里加里博士——1920年默片经典，讲精神病院和催眠，不是反战片。</div>'
  },
  {
    id:3, type:'obj',
    q:'以下哪部文艺作品不属于德国表现主义流派？',
    o:[
      {t:'卡夫卡《变形记》',s:0,note:'表现主义文学代表作：人变成甲虫的荒诞设定直指现代人的异化处境'},
      {t:'FW·茂瑙《大都会》',s:0,note:'表现主义电影代表作：扭曲的建筑与光影塑造了反乌托邦的视觉范本'},
      {t:'歌德《浮士德》',s:3,note:'歌德是德国古典主义与浪漫主义时期的巨匠，比表现主义早了一百多年'},
      {t:'爱德华·蒙克《呐喊》',s:0,note:'表现主义绘画的先声：扭曲的线条与强烈的色彩传达了存在性的焦虑'}
    ],
    roast:'这题有个温柔的小陷阱——四个选项三个德国人，特别容易把"德国"和"表现主义"自动焊在一起。但歌德写《浮士德》的时候表现主义的爷爷都还没出生，中间隔了一百多年。这大概相当于把李白拉进朦胧诗派——都是诗人没错，但一个在唐朝，一个在二十世纪，这顿饭约不上。',
    fullExplain:'<div style="margin-bottom:6px"><span style="color:#27ae60;font-weight:600">✓ C. 歌德《浮士德》（3分）</span>——虽然是德国人，但不属于表现主义</div><div style="padding-left:12px;color:#444;margin-bottom:8px">德国表现主义是20世纪初的艺术运动（卡夫卡、茂瑙、蒙克都在其中），而歌德的《浮士德》第一部1808年就出版了——比表现主义早了整整一百年。把"德国"和"表现主义"画等号，等于说"唐朝诗人是朦胧诗派"——国籍对，时空全错。</div><hr style="border:none;border-top:1px solid #e8e0d0;margin:8px 0"><div style="color:#999;font-size:.75rem">✗ A. 卡夫卡《变形记》——人变成甲虫，表现主义文学的核心命题就是异化和孤独。</div><div style="color:#999;font-size:.75rem">✗ B. 茂瑙《大都会》——1927年默片，扭曲的建筑和光影就是表现主义电影的标配。</div><div style="color:#999;font-size:.75rem">✗ D. 蒙克《呐喊》——扭动的天空和骷髅脸，表现主义绘画的先声。</div>'
  },
  {
    id:4, type:'obj',
    q:'萨特说过"______即地狱"？',
    o:[
      {t:'三人',s:0,note:'三人也可以是燃冬'},
      {t:'他人',s:3,note:'由他人的目光来定义我时，他人就成了我无法逃脱的精神牢笼'},
      {t:'存在',s:0,note:'用萨特的存在主义迷惑大家'},
      {t:'无间',s:0,note:'也是有无间地狱的，不过跟萨特没关系'}
    ],
    roast:'这几个选项确实都是干扰项里的优等生。"存在"是萨特另一句名言的关键词，"无间"确实有个地狱不过那是刘德华和梁朝伟的事。萨特说的"他人即地狱"——他在《禁闭》里写了三个死人被关在一间屋里，没有刑具没有火焰，仅仅是彼此打量互相定义，就已经是永恒折磨了。所以不是"讨厌的人就是地狱"，而是他人的目光像一台无法关机的镜头，永远在给你拍照。',
    fullExplain:'<div style="margin-bottom:6px"><span style="color:#27ae60;font-weight:600">✓ B. 他人（3分）</span>——L\'enfer, c\'est les autres</div><div style="padding-left:12px;color:#444;margin-bottom:8px">萨特1944年的独幕剧《禁闭》里，三个死人被关在同一间屋里——没有刑具，没有火焰，仅仅是彼此打量、互相定义，就已经是永恒地狱了。关键不是"讨厌的人就是地狱"，而是"他人的目光像一副手铐一样把我锁在了被定义的角色里"——更郁闷的是，我还需要通过你的目光来确认我自己。这悖论才是地狱。选"存在"的——你是把萨特两句最出名的口号搞串了。</div>'
  },
  {
    id:5, type:'obj',
    q:'柏拉图在《理想国》中用______比喻来描述人类对真理的认知困境。',
    o:[
      {t:'洞穴',s:3,note:'洞穴比喻是柏拉图哲学中最核心的思想意象，囚徒走出洞穴的过程即灵魂转向真实的过程'},
      {t:'深渊',s:0,note:''},
      {t:'峡谷',s:0,note:''},
      {t:'荒原',s:0,note:''}
    ],
    roast:'深渊、峡谷、荒原——这些选项放在一起还挺有画面感的，差点以为是《荒野求生》的选题会。但柏拉图用的是洞穴。一群囚徒被锁在洞里看墙上的影子，以为那就是全部真实。一个人挣脱出去被阳光刺得睁不开眼——原来真理第一次看是刺眼的。哲学史上最经典的比喻，选错不丢人，毕竟洞穴听起来确实没有深渊那么酷。',
    fullExplain:'<div style="margin-bottom:6px"><span style="color:#27ae60;font-weight:600">✓ A. 洞穴（3分）</span></div><div style="padding-left:12px;color:#444;margin-bottom:8px">一群囚徒被锁在洞里，只能看墙上的影子，以为那就是全部的真实。一个人挣脱锁链走出去——被阳光刺瞎（真理一开始是痛苦的）——然后看到了真正的世界。他好心回去告诉同伴，同伴觉得他疯了，甚至想杀了他（苏格拉底之死就是隐喻）。洞穴比喻不只是一个"认知有限"的故事——它是一次灵魂转向、一种教育理论、以及一个关于"说真话的人下场如何"的黑色预言。</div>'
  },
  {
    id:6, type:'obj',
    q:'以下哪部电影不是法国新浪潮的代表作品？',
    o:[
      {t:'《四百击》——特吕弗',s:0,note:'法国新浪潮的开山之作，特吕弗凭此片获戛纳最佳导演'},
      {t:'《筋疲力尽》——戈达尔',s:0,note:'新浪潮美学的宣言：跳切剪辑、手持摄影、对类型片的解构'},
      {t:'《八部半》——费里尼',s:3,note:'意大利电影大师费里尼的作品，属于意大利新现实主义后期与现代主义过渡期'},
      {t:'《广岛之恋》——雷乃',s:0,note:'法国新浪潮左岸派的代表作，阿伦·雷乃将文学性与电影语言深度融合'}
    ],
    roast:'费里尼是意大利人！意大利！把《八部半》塞进法国新浪潮，相当于把宫崎骏归到迪士尼动画公司——方向和国界全错了。',
    fullExplain:'<div style="margin-bottom:6px"><span style="color:#27ae60;font-weight:600">✓ C.《八部半》——费里尼（3分）</span>——意大利的，不是法国新浪潮</div><div style="padding-left:12px;color:#444;margin-bottom:8px">法国新浪潮是1950年代末的电影运动，核心人物是戈达尔、特吕弗、雷乃这批《电影手册》出身的法国导演。费里尼是意大利人，《八部半》是意大利新现实主义向现代主义转型的代表作。把费里尼放进法国新浪潮，相当于把王家卫当成好莱坞导演——方向上就错了。</div><hr style="border:none;border-top:1px solid #e8e0d0;margin:8px 0"><div style="color:#999;font-size:.75rem">✗ A.《四百击》——特吕弗的代表作，新浪潮"作者论"的开山之作。</div><div style="color:#999;font-size:.75rem">✗ B.《筋疲力尽》——戈达尔的跳切技法就是从这里炸出来的。</div><div style="color:#999;font-size:.75rem">✗ D.《广岛之恋》——雷乃拍的，新浪潮左岸派，不都是拍的法国但不影响它是新浪潮。</div>'
  },
  {
    id:7, type:'obj',
    q:'约翰·列侬《Imagine》——这首歌他到底在"想象"什么？最准确的解读是？',
    o:[
      {t:'一个没有战争和饥饿的乌托邦世界',s:1,note:'当然这也是约翰列侬的心愿，但不是这首歌要表达的'},

    fullExplain:'<div style="margin-bottom:6px"><span style="color:#27ae60;font-weight:600">✓ D. 幸福（3分）</span></div><div style="padding-left:12px;color:#444;margin-bottom:8px">加缪的法语原词是heureux（幸福），不是joyeux（快乐），不是satisfait（满足）。快乐是一会儿的事，幸福是一种存在状态。西西弗每天推石头上山、看它滚下来、再推——诸神以为这是最狠的惩罚。但加缪说：当西西弗转身下山的那个瞬间，他意识到了这一切有多荒诞——然后他选择了继续推，于是他就超越了命运。选"快乐"的人读歪了整个荒诞哲学：加缪不是让你在无意义里找乐子，是让你明知没意义还活着——而且活成一种幸福。</div>'

// ============================================================
// STATS ENGINE (localStorage + JSONBin 云端同步)
// ============================================================
var LS_KEY='wenqing_exam_stats';

function fetchStats(){
  try{
    var d=localStorage.getItem(LS_KEY);
    return d?JSON.parse(d):{};
  }catch(e){ return {}; }
}

function pushStats(stats){
  try{ localStorage.setItem(LS_KEY,JSON.stringify(stats)); }catch(e){}
  syncToCloud(stats);
}

// 页面加载时从云端拉取数据合并到本地（不影响页面渲染速度，fire-and-forget）
function syncFromCloud(){
  if(!CLOUD_ENABLED||BIN_ID==='YOUR_BIN_ID') return;
  var url='https://api.jsonbin.io/v3/b/'+BIN_ID+'/latest';
  fetch(url,{headers:{'X-Master-Key':API_KEY}}).then(function(r){
    if(!r.ok) throw new Error('status '+r.status);
    return r.json();
  }).then(function(j){
    var cloud=j.record||{};
    if(!cloud.total) return;
    var local=fetchStats();
    // 云端数据量更大就用云端的，否则保留本地
    if(cloud.total>(local.total||0)){
      localStorage.setItem(LS_KEY,JSON.stringify(cloud));
      // 刷新顶部人数显示
      var el=document.getElementById('statsFlash');
      if(el) el.textContent='📊 已有 '+cloud.total+' 人参与了这场考试 · 提交后即可查看全部答题统计';
    }
  }).catch(function(e){ console.log('☁️ 云端数据同步跳过（离线或未配置）'); });
}

// 提交后异步推送到云端（不阻塞提交流程，失败也不影响）
function syncToCloud(stats){
  if(!CLOUD_ENABLED||BIN_ID==='YOUR_BIN_ID') return;
  var json=JSON.stringify(stats);
  fetch('https://api.jsonbin.io/v3/b/'+BIN_ID,{
    method:'PUT',
    headers:{'X-Master-Key':API_KEY,'Content-Type':'application/json','X-Bin-Versioning':'false'},
    body:json
  }).catch(function(e){ console.log('☁️ 云端推送跳过'); });
}

function mergeSubmit(stats,userAnswers){
  var s=JSON.parse(JSON.stringify(stats));
  if(typeof s.total!=='number') s.total=0;
  s.total++;
  s.mc=s.mc||{};
  s.fill=s.fill||{};
  Q.forEach(function(q){
    var aid=q.id;
    if(q.type==='fill'){
      s.fill[aid]=s.fill[aid]||{correct:0,total:0};
      s.fill[aid].total++;
      var ua=(userAnswers[aid]||'').trim();
      if(ua===q.answer) s.fill[aid].correct++;
    } else {
      s.mc[aid]=s.mc[aid]||{};
      var sel=userAnswers[aid];
      if(sel!==null&&sel!==undefined&&sel!==''){
        var idx=parseInt(sel);
        if(!isNaN(idx)&&idx>=0&&idx<26){
          s.mc[aid][String.fromCharCode(65+idx)]=(s.mc[aid][String.fromCharCode(65+idx)]||0)+1;
        }
      }
    }
  });
  return s;
}

  const root=document.getElementById('root');root.innerHTML='';

  const flash=document.createElement('div');flash.className='stats-flash';flash.id='statsFlash';
  flash.textContent='加载统计数据中…';root.appendChild(flash);

  // MC section
  Q.forEach(q=>{
    const card=document.createElement('div');card.className='q-card';
    const hdr=document.createElement('div');hdr.className='q-header';
    const num=document.createElement('span');num.className='q-num';num.textContent=`#${String(q.id).padStart(2,'0')}`;
    const txt=document.createElement('span');txt.className='q-text';txt.textContent=q.q;
    const tb=document.createElement('span');tb.className=`q-type t-${q.type}`;
    tb.textContent=q.type==='obj'?'客观':(q.type==='sub'?'主观':'填空');
    hdr.appendChild(num);hdr.appendChild(txt);hdr.appendChild(tb);card.appendChild(hdr);

    if(q.type==='fill'){
      const inp=document.createElement('input');inp.className='blank-input';
      inp.type='text';inp.placeholder='请输入答案（必须完全匹配）';inp.autocomplete='off';
      inp.id=`inp-${q.id}`;
      inp.addEventListener('input',()=>{answers[q.id]=inp.value;flags[q.id]=true;});
      card.appendChild(inp);
    } else {
      const wrap=document.createElement('div');wrap.className='options';
      q.o.forEach((opt,oi)=>{
        const label=document.createElement('label');label.className='option';
        const radio=document.createElement('input');radio.type='radio';radio.name=`q${q.id}`;radio.value=oi;
        radio.addEventListener('change',()=>{answers[q.id]=oi;flags[q.id]=true;wrap.querySelectorAll('.option').forEach(el=>el.classList.remove('selected'));label.classList.add('selected');});
        const span=document.createElement('span');span.textContent=`${String.fromCharCode(65+oi)}. ${opt.t}`;
        label.appendChild(radio);label.appendChild(span);wrap.appendChild(label);
      });
      card.appendChild(wrap);
    }
    root.appendChild(card);
  });

  // Submit
  const sw=document.createElement('div');sw.className='submit-wrap';
  const sb=document.createElement('button');sb.className='btn-submit';sb.textContent='提交答案';
  sb.addEventListener('click',onSubmit);sw.appendChild(sb);root.appendChild(sw);
  const rw=document.createElement('div');rw.className='result-wrap';rw.id='resultWrap';root.appendChild(rw);

  // Load stats async
  loadStatsFlash();
}

function loadStatsFlash(){
  try{
    var s=fetchStats();
    var total=s.total||0;
    document.getElementById('statsFlash').textContent=total>0
      ?'📊 已有 '+total+' 人参与了这场考试 · 提交后即可查看全部答题统计'
      :'📊 即将成为第一位答题者 · 提交后即可查看全部答题统计';
  }catch(e){
    document.getElementById('statsFlash').textContent='📊 即将成为第一位答题者 · 提交后即可查看全部答题统计';
  }
  // 后台尝试从云端拉取更完整的数据（不影响页面渲染）
  syncFromCloud();
}

// ============================================================
// SUBMIT
// ============================================================
function onSubmit(){
  const sb=document.querySelector('.btn-submit');
  const origText=sb.textContent;

  try{
    const unf=Q.some(q=>!flags[q.id]);
    if(unf&&!confirm('还有题目没答完，确定提交？')) return;

    // Loading state
    sb.textContent='提交中…';
    sb.disabled=true;
    sb.style.opacity='0.7';
    sb.style.cursor='wait';

    // Score
    let score=0; const details=[];
    Q.forEach(q=>{
      if(q.type==='fill'){
        const ua=(answers[q.id]||'').trim();
        const ok=ua===q.answer;
        if(ok) score+=3;
        details.push({q,ua,ok,pts:ok?3:0});
      } else {
        const sel=answers[q.id];
        if(sel===null||sel===undefined){details.push({q,ua:'未作答',ok:false,pts:0});return;}
        const opt=q.o[sel];
        score+=opt.s;
        const best=q.o.reduce((a,b)=>a.s>b.s?a:b);
        details.push({q,ua:opt.t,ok:opt.s===best.s,pts:opt.s,optIdx:sel});
      }
    });

    const pct=Math.round(score/maxScore*100);

    // Push stats
    var currentStats=fetchStats();
    currentStats=mergeSubmit(currentStats, answers);
    pushStats(currentStats);

    // Show result
    showResult(score,maxScore,pct,details,currentStats);

  }catch(e){
    alert('提交过程出错：'+e.message+'。请刷新页面重试。如果问题持续，请在代码中设置 CLOUD_ENABLED=false 使用离线模式。');
    console.error('Submit error:',e);
    sb.textContent=origText;
    sb.disabled=false;
    sb.style.opacity='1';
    sb.style.cursor='pointer';
  }
}

// ============================================================
// RESULT
// ============================================================
function showResult(score,max,pct,details,stats){
  const rw=document.getElementById('resultWrap');rw.innerHTML='';rw.classList.add('show');

  const card=document.createElement('div');card.className='result-card';
  let emoji,title,main;

  const wrongs=details.filter(d=>!d.ok);

  if(pct>=70){
    emoji='🖤';title='真·文艺青年';
    main='你在这份考卷上的表现，说明了两件事：第一，你真的读过那些书、看过那些电影、思考过那些问题。你知道"生而为人我很抱歉"是寺内寿太郎写的，知道《浮士德》不属于表现主义，知道"高尚是高尚者的墓志铭"是北岛那句诗的下半句。这些不是靠刷豆瓣金句能记住的东西——它们来自你在精神世界里花过的时间。\n\n第二，你对生活有自己的态度。你在音乐节选择专注听音乐而不是摆拍穿搭，你心动的理由是"可以deep talk"，你知道真正的文青从不会主动给自己贴标签。文艺对你来说不是人设，是日常。你不需要用文艺来证明自己——这恰好是你最文艺的地方。';
    if(wrongs.length>0){
      main+='\n\n不过——';
      const picks=wrongs.slice(0,2);
      picks.forEach(d=>{
        const best=d.q.o?d.q.o.reduce((a,b)=>a.s>b.s?a:b):null;
        if(best&&d.optIdx!==undefined){
          main+=`\n\nQ${d.q.id}「${d.q.q.slice(0,28)}…」你选了"${d.ua}"，最佳答案是"${best.t}"。`;
          if(best.note) main+=`\n${best.note}`;
        }
        if(d.q.type==='fill'){
          main+=`\n\nQ${d.q.id}「${d.q.q.slice(0,28)}…」你填的是"${d.ua}"，正确答案是"${d.q.answer}"。`;
        }
      });
    }
  } else if(pct>=40){
    emoji='🎭';title='伪文青';
    main='你的文艺姿态是薛定谔的——打开朋友圈的时候有，关上屏幕的时候无。你知道一些名词，但它们的精确含义对你来说像隔着一层毛玻璃——看得见轮廓，看不清细节。';

    if(wrongs.length>0){
      main+='\n\n来看看你答错的几道题--每一道都是伪文青的经典翻车现场：';
      const mcW=wrongs.filter(d=>d.q.type==='obj'||d.q.type==='sub');
      const fillW=wrongs.filter(d=>d.q.type==='fill');
      const picks=[...mcW,...fillW].slice(0,3);
      picks.forEach(d=>{
        if(d.q.type==='fill'){
          main+=`\n\nQ${d.q.id}「${d.q.q.slice(0,30)}…」`;
          main+=`\n⚠️ 你填了："${d.ua||'（空）'}"，答案是"${d.q.answer}"`;
          if(d.q.roast) main+=`\n🔍 ${d.q.roast}`;
        } else {
          const best=d.q.o.reduce((a,b)=>a.s>b.s?a:b);
          main+=`\n\nQ${d.q.id}「${d.q.q.slice(0,30)}…」`;
          main+=`\n⚠️ 你选了"${d.ua}"，答案是"${best.t}"`;
          if(d.q.roast) main+=`\n🔍 ${d.q.roast}`;
        }
      });
    }
  } else {
    emoji='💼';title='已与文艺划清界限';
    main='坦白说，这份考卷你基本上在裸考。文艺青年那套话语体系——萨特、加缪、表现主义、新浪潮、蒙太奇——对你来说大概是另一颗星球的语言。';

    if(wrongs.length>0){
      main+='\n\n先来看看你答错的几道题吧：';
      const mcW=wrongs.filter(d=>d.q.type==='obj'||d.q.type==='sub');
      const fillW=wrongs.filter(d=>d.q.type==='fill');
      const picks=[...mcW,...fillW].slice(0,3);
      picks.forEach(d=>{
        if(d.q.type==='fill'){
          main+=`\n\nQ${d.q.id}「${d.q.q.slice(0,30)}…」`;
          main+=`\n⚠️ 你填了："${d.ua||'（空）'}"，答案是"${d.q.answer}"`;
          if(d.q.roast) main+=`\n🔍 ${d.q.roast}`;
        } else {
          const best=d.q.o.reduce((a,b)=>a.s>b.s?a:b);
          main+=`\n\nQ${d.q.id}「${d.q.q.slice(0,30)}…」`;
          main+=`\n⚠️ 你选了"${d.ua}"，答案是"${best.t}"`;
          if(d.q.roast) main+=`\n🔍 ${d.q.roast}`;
        }
      });
    }

    main+='\n\n但是——文艺只是生活的一部分，不是什么必需品。不喜欢读哲学没关系，不听摇滚乐没关系，分不清戈达尔和特吕弗更没关系。你不需要用这些来证明自己有深度。一顿好吃的饭、一个睡到自然醒的周末、一只路边朝你喵了一声的猫——这些带来的快乐不比懂得"他人即地狱"少一丁点。你快乐就好，真的。';
  }

  const e=document.createElement('div');e.className='emoji-big';e.textContent=emoji;
  const t=document.createElement('div');t.className='title';t.textContent=title;
  const s=document.createElement('div');s.className='score';s.textContent=`得分：${score} / ${max}（${pct}%）`;
  const c=document.createElement('div');c.className='comment';c.innerHTML=main.replace(/\n/g,'<br>');
  card.appendChild(e);card.appendChild(t);card.appendChild(s);card.appendChild(c);

  // Review panel with STATS
  const revSec=document.createElement('div');revSec.style.cssText='margin-top:14px';
  const revBtn=document.createElement('button');revBtn.className='btn-review';revBtn.textContent='📋 查看全部答案解析与统计分布';
  const revPanel=document.createElement('div');revPanel.className='review-panel';
  revBtn.addEventListener('click',()=>{
    revPanel.classList.toggle('show');
    revBtn.textContent=revPanel.classList.contains('show')?'📋 收起解析':'📋 查看全部答案解析与统计分布';
  });

  let rh='';
  const colors=['#6c5b7b','#c06c4a','#3a7ca5','#b3423a','#27ae60'];

  Q.forEach(q=>{
    const d=details.find(x=>x.q.id===q.id);
    rh+=`<div class="rv-item"><span class="rv-num">Q${q.id}</span>${q.q}`;
    if(q.type==='fill'){
      rh+=`<br><span class="rv-correct">✓ 正确答案：${q.answer}</span>`;
      rh+=`<br><span style="font-size:.75rem;color:#999">你的答案：${d?d.ua||'（空）':'（空）'}（得分：${d?d.pts:'—'}分）</span>`;
      if(q.x) rh+=`<div class="rv-expl">${q.x}</div>`;
      // Fill stats
      const fs=(stats.fill||{})[q.id];
      if(fs&&fs.total>0){
        const rate=Math.round(fs.correct/fs.total*100);
        rh+=`<div class="fill-stat">📊 答对率：<span class="big-num">${rate}%</span>（${fs.correct}/${fs.total}人）</div>`;
      }
    } else {
      const best=q.o.reduce((a,b)=>a.s>b.s?a:b);
      rh+=`<br><span class="rv-correct">你的得分：${d?d.pts:'—'}分</span>`;
      // MC stats
      const ms=(stats.mc||{})[q.id];
      const totalVotes=ms?Object.values(ms).reduce((a,b)=>a+b,0):0;
      q.o.forEach((opt,oi)=>{
        const lbl=String.fromCharCode(65+oi);
        const votes=ms&&ms[lbl]?ms[lbl]:0;
        const vpct=totalVotes>0?Math.round(votes/totalVotes*100):0;
        const isBest=opt.s===best.s;
        const isYours=d&&d.optIdx===oi;
        rh+=`<div class="stat-row">`;
        rh+=`<span class="stat-opt">${lbl}.</span>`;
        rh+=`<span style="font-size:.74rem;flex:1;color:${isBest?'#27ae60':isYours?'#c0392b':'#555'}">${opt.t.slice(0,36)}${opt.t.length>36?'…':''} ${isBest?'✓':''} ${isYours?'← 你的选择':''} ${opt.s>0&&opt.s<3?'(+'+opt.s+'分)':''}</span>`;
        rh+=`<span class="stat-label">${votes||0}人·${vpct}%</span>`;
        rh+=`<div class="stat-bar-wrap"><div class="stat-bar-fill" style="width:${vpct}%;background:${colors[oi%5]}"></div></div>`;
        rh+=`</div>`;
      });
      // 详细解析——放在所有选项+统计图的最下方
      rh+=`<div class="rv-expl" style="margin-top:10px;padding:10px 12px;background:#fffef9;border-radius:8px;border:1px solid #e8e0d0;line-height:1.9;font-size:.78rem">`;
      rh+=`<div style="font-weight:600;color:#b8860b;margin-bottom:8px">📝 详细解析</div>`;
      if(q.fullExplain){
        rh+=q.fullExplain;
      } else {
        rh+=`<div style="margin-bottom:6px"><span style="color:#27ae60;font-weight:600">✓ 正确答案：</span>${best.t}</div>`;
        rh+=`<div style="margin-bottom:10px;padding-left:12px;color:#444">${best.note||'该选项为本题最佳答案。'}</div>`;
        q.o.forEach((opt,oi)=>{
          if(opt.s>0&&opt.s<3&&opt.note){
            rh+=`<div style="margin-bottom:4px"><span style="color:#c06c4a;font-weight:600">⚠️ 易错选项：</span>${opt.t}（${opt.s}分）</div>`;
            rh+=`<div style="margin-bottom:8px;padding-left:12px;color:#666">${opt.note}</div>`;
          }
        });
        q.o.forEach((opt,oi)=>{
          if(opt.s===0&&opt.note){
            rh+=`<div style="margin-bottom:4px"><span style="color:#999;font-weight:600">✗ 干扰项：</span>${opt.t}</div>`;
            rh+=`<div style="margin-bottom:6px;padding-left:12px;color:#999;font-size:.74rem">${opt.note}</div>`;
          }
        });
      }
      rh+=`</div>`;
    }
    rh+=`</div>`;
  });
  revPanel.innerHTML=rh;
  revSec.appendChild(revBtn);revSec.appendChild(revPanel);
  card.appendChild(revSec);

  rw.appendChild(card);
  rw.scrollIntoView({behavior:'smooth',block:'center'});
  document.querySelector('.submit-wrap').style.display='none';
  document.getElementById('statsFlash').style.display='none';
}

render();
</script>
</body>
</html>
